<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Label normalizer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#16232e;font:17px system-ui;padding:32px 20px}main{max-width:650px;margin:0 auto;padding:28px;border:1px solid #d6e0ea;border-radius:16px;background:#fff}h1{font-size:28px;margin:0 0 12px}p{line-height:1.5;color:#46566a}label{display:block;margin-top:24px;margin-bottom:8px;font-weight:600}input{width:100%;padding:12px;font:inherit;border:1px solid #7a8c9f;border-radius:8px}button{margin-top:16px;padding:12px 18px;font:inherit;border:0;border-radius:8px;background:#205ed2;color:white;cursor:pointer}ul{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none}li{border-radius:20px;background:#e4edff;color:#16479f;padding:7px 13px;overflow-wrap:anywhere;max-width:100%}small{display:block;margin-top:26px;font:12px monospace;overflow-wrap:anywhere;color:#526477}@media(max-width:400px){body{padding:20px 12px}main{padding:20px}h1{font-size:25px}button{width:100%}}</style>
</head><body><main><h1>Organize your labels</h1><p>Enter labels separated by commas. Clean labels keep their first appearance.</p>
<form><label for="labels">Labels</label><input id="labels" name="labels" placeholder="Red, Blue, Green"><button type="submit">Normalize labels</button></form>
<p id="status" role="status">Your normalized labels will appear here.</p><ul id="results" aria-label="Normalized labels"></ul><small id="revision"></small></main>
<script type="module" src="ui.mjs"></script></body></html>
